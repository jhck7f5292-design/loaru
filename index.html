<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LOARU – The Ritual v1.23</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 100vh;
      background: #000;
    }

    .title {
      position: absolute;
      top: max(5.5vh, 44px);
      left: 0;
      right: 0;
      z-index: 20;
      color: #d7b56d;
      text-align: center;
      font-size: clamp(24px, 7vw, 38px);
      font-weight: 300;
      letter-spacing: .28em;
      padding-left: .28em;
    }

    .vessel {
      position: absolute;
      left: 50%;
      top: 59%;
      width: min(102vw, 560px);
      height: auto;
      transform: translate(-50%, -50%);
      z-index: 8;
      user-select: none;
      -webkit-user-drag: none;
    }

    .disc {
      position: absolute;
      left: 50%;
      top: -22px;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      object-fit: contain;
      opacity: 0;
      z-index: 9;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.6));
      animation-name: dropDisc;
      animation-timing-function: cubic-bezier(.35,.03,.19,1);
      animation-fill-mode: forwards;
      user-select: none;
      -webkit-user-drag: none;
    }

    .water-stream {
      position: absolute;
      left: 50%;
      top: -10vh;
      width: 3px;
      height: 0;
      margin-left: -1.5px;
      z-index: 11;
      opacity: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,.07), rgba(220,242,255,.72), rgba(255,255,255,.14));
      box-shadow: 0 0 5px rgba(185,225,255,.18);
      animation: waterStream 3.4s 11.2s ease-in-out forwards;
    }

    .water-window,
    .cocoa-window,
    .flow-window,
    .root-window {
      position: absolute;
      left: 49.4%;
      top: 62.3%;
      width: min(27vw, 114px);
      height: 19.2svh;
      transform: translate(-50%, -50%);
      overflow: hidden;
      border-radius: 43% 43% 52% 52% / 6% 6% 18% 18%;
      clip-path: polygon(4% 0%, 94% 0%, 92% 70%, 78% 100%, 12% 100%, 4% 74%);
      pointer-events: none;
    }

    .water-window { z-index: 5; }
    .cocoa-window { z-index: 10; }
    .flow-window { z-index: 12; }
    .root-window { z-index: 13; }

    .water,
    .cocoa,
    .flow-fill,
    .root-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 46% 46% 50% 50% / 7% 7% 18% 18%;
      clip-path: polygon(1% 0%, 96% 0%, 93% 70%, 79% 100%, 10% 100%, 2% 74%);
    }

    .water {
      height: 0;
      opacity: 0;
      background: linear-gradient(to bottom, rgba(230,246,255,.18), rgba(180,220,242,.28) 45%, rgba(120,180,215,.34) 100%);
      animation: waterRise 3.4s 11.2s ease-in-out forwards;
    }

    .water::before,
    .cocoa::before,
    .flow-fill::before,
    .root-fill::before {
      content: "";
      position: absolute;
      top: -4px;
      left: 8%;
      width: 84%;
      height: 8px;
      border-radius: 50%;
    }

    .water::before {
      top: -3px;
      left: 10%;
      width: 80%;
      height: 6px;
      background: radial-gradient(ellipse at center, rgba(240,250,255,.42) 0%, rgba(185,225,245,.22) 48%, transparent 79%);
      animation: ripple 1.1s 11.2s ease-in-out 3;
    }

    .cocoa {
      height: 0;
      opacity: 0;
      background: linear-gradient(to bottom, rgba(74,38,23,.98) 0%, rgba(43,21,13,1) 48%, rgba(18,8,5,1) 100%);
      box-shadow: inset 8px 0 12px rgba(255,255,255,.035), inset -8px 0 12px rgba(0,0,0,.10);
      animation: cocoaRise 2.6s 13.0s ease-in-out forwards;
    }

    .cocoa::before {
      background: radial-gradient(ellipse at center, rgba(116,70,45,.62) 0%, rgba(67,34,20,.46) 48%, transparent 78%);
      opacity: 0;
      animation: cocoaSurface 2.6s 13.0s ease-in-out forwards;
    }

    .flow-stream,
    .root-stream {
      position: absolute;
      left: 50%;
      top: -10vh;
      height: 0;
      z-index: 14;
      opacity: 0;
      border-radius: 999px;
    }

    .flow-stream {
      width: 4px;
      margin-left: -2px;
      background: linear-gradient(90deg, rgba(255,215,120,.14), rgba(230,187,78,.92), rgba(255,224,146,.22));
      box-shadow: 0 0 10px rgba(214,171,79,.34), 0 0 18px rgba(214,171,79,.18);
      animation: flowStream 2.2s 16.2s ease-in-out forwards;
    }

    .root-stream {
      width: 6px;
      margin-left: -3px;
      background: linear-gradient(90deg, rgba(255,241,198,.16), rgba(231,199,118,.96), rgba(255,233,170,.28));
      box-shadow: 0 0 11px rgba(229,194,120,.35), 0 0 20px rgba(229,194,120,.18);
      animation: rootStream 2.3s 18.9s ease-in-out forwards;
    }

    .flow-fill,
    .root-fill {
      height: 18.4svh;
      opacity: 0;
    }

    .flow-fill {
      background: linear-gradient(to bottom, rgba(93,49,29,.96) 0%, rgba(66,34,20,.98) 50%, rgba(30,14,8,1) 100%);
      animation: flowFill 2.2s 16.2s ease-in-out forwards;
    }

    .flow-fill::before {
      background: radial-gradient(ellipse at center, rgba(166,120,72,.48) 0%, rgba(92,53,28,.34) 48%, transparent 78%);
      opacity: 0;
      animation: liquidSurface 2.2s 16.2s ease-in-out forwards;
    }

    .root-fill {
      background: linear-gradient(to bottom, rgba(125,86,49,.22) 0%, rgba(95,56,32,.18) 28%, rgba(51,28,16,.10) 58%, rgba(26,12,8,0) 100%);
      mix-blend-mode: screen;
      animation: rootFill 2.3s 18.9s ease-in-out forwards;
    }

    .root-fill::before {
      background: radial-gradient(ellipse at center, rgba(233,205,140,.42) 0%, rgba(194,146,82,.18) 48%, transparent 80%);
      opacity: 0;
      animation: liquidSurface 2.3s 18.9s ease-in-out forwards;
    }

    .flow-label,
    .root-label {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      opacity: 0;
      color: #d7b56d;
      text-align: center;
      font-size: clamp(16px, 4.5vw, 22px);
      font-weight: 500;
      letter-spacing: .24em;
      padding-left: .24em;
      text-shadow: 0 0 10px rgba(215,181,109,.12);
      text-transform: uppercase;
      pointer-events: none;
    }

    .flow-label {
      left: calc(50% - 42px);
      top: 18.2vh;
      animation: flowLabel 2.2s 16.2s ease-in-out forwards;
    }

    .root-label {
      left: calc(50% + 42px);
      top: 18.2vh;
      animation: rootLabel 2.3s 18.9s ease-in-out forwards;
    }

    .footer {
      position: absolute;
      bottom: max(2.5vh, 18px);
      left: 0;
      right: 0;
      color: rgba(255,255,255,.28);
      text-align: center;
      font-size: 10px;
      letter-spacing: .34em;
      padding-left: .34em;
    }

    @keyframes dropDisc {
      0% { opacity: 0; transform: translate(var(--x-start), 0) scale(.94) rotate(0deg); }
      7% { opacity: 1; }
      88% { transform: translate(var(--x-end), var(--fall)) scale(1) rotate(var(--spin)); }
      94% { transform: translate(var(--x-end), calc(var(--fall) - 0.55svh)) scale(1) rotate(var(--spin)); }
      100% { opacity: 1; transform: translate(var(--x-end), var(--fall)) scale(1) rotate(var(--spin)); }
    }

    @keyframes waterStream {
      0% { opacity: 0; height: 0; }
      8% { opacity: .82; height: 66svh; }
      88% { opacity: .82; height: 66svh; }
      100% { opacity: 0; height: 0; }
    }

    @keyframes waterRise {
      0% { opacity: 0; height: 0; }
      10% { opacity: 1; }
      100% { opacity: 1; height: 17.1svh; }
    }

    @keyframes cocoaRise {
      0% { opacity: 0; height: 0; }
      8% { opacity: .82; }
      100% { opacity: 1; height: 18.4svh; }
    }

    @keyframes cocoaSurface {
      0%, 8% { opacity: 0; transform: scaleX(.86); }
      45% { opacity: .55; transform: scaleX(1.02); }
      100% { opacity: .72; transform: scaleX(.96); }
    }

    @keyframes flowStream {
      0% { opacity: 0; height: 0; }
      12% { opacity: .95; height: 63svh; }
      82% { opacity: .95; height: 63svh; }
      100% { opacity: 0; height: 0; }
    }

    @keyframes rootStream {
      0% { opacity: 0; height: 0; }
      12% { opacity: .96; height: 63svh; }
      82% { opacity: .96; height: 63svh; }
      100% { opacity: 0; height: 0; }
    }

    @keyframes flowFill {
      0% { opacity: 0; filter: brightness(1); }
      18% { opacity: .18; filter: brightness(1.04); }
      100% { opacity: 1; filter: brightness(1.08); }
    }

    @keyframes rootFill {
      0% { opacity: 0; transform: translateY(8px); }
      20% { opacity: .14; transform: translateY(4px); }
      100% { opacity: .62; transform: translateY(0); }
    }

    @keyframes liquidSurface {
      0%, 8% { opacity: 0; transform: scaleX(.86); }
      45% { opacity: .50; transform: scaleX(1.02); }
      100% { opacity: .66; transform: scaleX(.96); }
    }

    @keyframes flowLabel {
      0% { opacity: 0; transform: translateX(-50%) translateY(-5px); }
      18% { opacity: 1; transform: translateX(-50%) translateY(0); }
      82% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(4px); }
    }

    @keyframes rootLabel {
      0% { opacity: 0; transform: translateX(-50%) translateY(-5px); }
      18% { opacity: 1; transform: translateX(-50%) translateY(0); }
      82% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(4px); }
    }

    @keyframes ripple {
      0%, 100% { transform: scaleX(.9); opacity: .35; }
      50% { transform: scaleX(1); opacity: .6; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="title">THE RITUAL</div>

    <div class="flow-label">FLOW</div>
    <div class="root-label">ROOT</div>

    <div class="water-window" aria-hidden="true"><div class="water"></div></div>
    <div class="cocoa-window" aria-hidden="true"><div class="cocoa"></div></div>
    <div class="flow-window" aria-hidden="true"><div class="flow-fill"></div></div>
    <div class="root-window" aria-hidden="true"><div class="root-fill"></div></div>

    <img class="vessel" src="assets/vessel.png" alt="LOARU Vessel">

    <img class="disc" src="assets/core.png" alt="" style="--x-start:-2px;--x-end:-5px;--fall:78.8svh;--spin:150deg;animation-duration:2.8s;animation-delay:1.0s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:2px;--x-end:4px;--fall:78.5svh;--spin:220deg;animation-duration:2.75s;animation-delay:3.2s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-3px;--x-end:7px;--fall:78.2svh;--spin:290deg;animation-duration:2.7s;animation-delay:5.25s;">

    <img class="disc" src="assets/core.png" alt="" style="--x-start:-5px;--x-end:-15px;--fall:78.7svh;--spin:280deg;animation-duration:2.25s;animation-delay:7.10s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:5px;--x-end:15px;--fall:78.6svh;--spin:340deg;animation-duration:2.20s;animation-delay:7.20s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-2px;--x-end:-7px;--fall:78.3svh;--spin:210deg;animation-duration:2.22s;animation-delay:7.30s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:6px;--x-end:18px;--fall:78.2svh;--spin:300deg;animation-duration:2.28s;animation-delay:7.40s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-7px;--x-end:-20px;--fall:78.1svh;--spin:260deg;animation-duration:2.18s;animation-delay:7.50s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:2px;--x-end:5px;--fall:77.9svh;--spin:390deg;animation-duration:2.20s;animation-delay:7.60s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:7px;--x-end:20px;--fall:77.8svh;--spin:330deg;animation-duration:2.24s;animation-delay:7.70s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-4px;--x-end:-13px;--fall:77.7svh;--spin:250deg;animation-duration:2.16s;animation-delay:7.80s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:3px;--x-end:10px;--fall:77.5svh;--spin:420deg;animation-duration:2.18s;animation-delay:7.90s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-8px;--x-end:-22px;--fall:77.4svh;--spin:370deg;animation-duration:2.28s;animation-delay:8.00s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:5px;--x-end:15px;--fall:77.3svh;--spin:280deg;animation-duration:2.17s;animation-delay:8.10s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-1px;--x-end:-3px;--fall:77.1svh;--spin:360deg;animation-duration:2.20s;animation-delay:8.20s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:8px;--x-end:22px;--fall:77.0svh;--spin:410deg;animation-duration:2.24s;animation-delay:8.30s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-6px;--x-end:-17px;--fall:76.9svh;--spin:300deg;animation-duration:2.14s;animation-delay:8.40s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:2px;--x-end:6px;--fall:76.7svh;--spin:430deg;animation-duration:2.18s;animation-delay:8.50s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-9px;--x-end:-24px;--fall:76.6svh;--spin:380deg;animation-duration:2.30s;animation-delay:8.60s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:6px;--x-end:18px;--fall:76.5svh;--spin:320deg;animation-duration:2.12s;animation-delay:8.70s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-3px;--x-end:-9px;--fall:76.3svh;--spin:450deg;animation-duration:2.17s;animation-delay:8.80s;">

    <div class="water-stream" aria-hidden="true"></div>
    <div class="flow-stream" aria-hidden="true"></div>
    <div class="root-stream" aria-hidden="true"></div>

    <div class="footer">LOARU · VERSION 1.23</div>
  </main>

  <script>
    window.setTimeout(() => {
      document.querySelectorAll('.disc').forEach((disc, index) => {
        disc.animate(
          [
            { opacity: 1, filter: 'drop-shadow(0 3px 6px rgba(0,0,0,.6)) brightness(1)' },
            { opacity: 0.58, filter: 'drop-shadow(0 2px 4px rgba(0,0,0,.4)) brightness(.78) blur(.3px)', offset: 0.45 },
            { opacity: 0.06, filter: 'drop-shadow(0 0 0 rgba(0,0,0,0)) brightness(.45) blur(1.2px)' }
          ],
          {
            duration: 2200,
            delay: index * 20,
            easing: 'ease-in-out',
            fill: 'forwards'
          }
        );
      });
    }, 13150);
  </script>
</body>
</html>
