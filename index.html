<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LOARU – The Ritual v0.3</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 100vh;
      background: #000;
    }

    .title {
      position: absolute;
      top: max(6vh, 48px);
      left: 0;
      right: 0;
      z-index: 5;
      color: #d7b56d;
      text-align: center;
      font-size: clamp(24px, 7vw, 38px);
      font-weight: 300;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      opacity: 0;
      animation: fadeIn 1.2s ease forwards;
    }

    .vessel {
      position: absolute;
      left: 50%;
      top: 56%;
      width: min(78vw, 430px);
      height: auto;
      transform: translate(-50%, -50%) scale(0.96);
      opacity: 0;
      z-index: 2;
      animation: vesselIn 1.3s 0.35s ease forwards;
      user-select: none;
      -webkit-user-drag: none;
    }

    .core {
      position: absolute;
      left: 50%;
      top: -26px;
      width: 20px;
      height: 20px;
      margin-left: -10px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #906040 0 18%, #5b3523 45%, #2d1810 100%);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.5);
      opacity: 0;
      z-index: 4;
      animation: dropDisc 2.6s 1.8s forwards;
    }

    .footer {
      position: absolute;
      bottom: max(3vh, 22px);
      left: 0;
      right: 0;
      color: rgba(255, 255, 255, 0.35);
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.35em;
      padding-left: 0.35em;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes vesselIn {
      from {
        opacity: 0;
        transform: translate(-50%, -46%) scale(0.94);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes dropDisc {
      0% {
        opacity: 0;
        transform: translateY(0);
      }

      8% {
        opacity: 1;
      }

      82% {
        transform: translateY(58svh);
      }

      92% {
        transform: translateY(56.8svh);
      }

      100% {
        opacity: 1;
        transform: translateY(57.6svh);
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <div class="title">THE RITUAL</div>

    <img
      class="vessel"
      src="assets/vessel.png"
      alt="LOARU Vessel"
    >

    <div class="core" aria-hidden="true"></div>

    <div class="footer">LOARU · VERSION 0.3</div>
  </main>
</body>
</html>
