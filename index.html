<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LOARU – The Ritual v0.9</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 100vh;
      background: #000;
    }

    .title {
      position: absolute;
      top: max(5.5vh, 44px);
      left: 0;
      right: 0;
      z-index: 10;
      color: #d7b56d;
      text-align: center;
      font-size: clamp(24px, 7vw, 38px);
      font-weight: 300;
      letter-spacing: .28em;
      padding-left: .28em;
    }

    .vessel {
      position: absolute;
      left: 50%;
      top: 59%;
      width: min(102vw, 560px);
      height: auto;
      transform: translate(-50%, -50%);
      z-index: 2;
      user-select: none;
      -webkit-user-drag: none;
    }

    .disc {
      position: absolute;
      left: 50%;
      top: -14px;
      width: 11px;
      height: 11px;
      margin-left: -5.5px;
      object-fit: contain;
      opacity: 0;
      z-index: 4;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.55));
      animation-name: dropDisc;
      animation-timing-function: cubic-bezier(.35,.03,.19,1);
      animation-fill-mode: forwards;
      user-select: none;
      -webkit-user-drag: none;
    }

    .footer {
      position: absolute;
      bottom: max(2.5vh, 18px);
      left: 0;
      right: 0;
      color: rgba(255,255,255,.28);
      text-align: center;
      font-size: 10px;
      letter-spacing: .34em;
      padding-left: .34em;
    }

    @keyframes dropDisc {
      0% {
        opacity: 0;
        transform: translate(var(--x-start), 0) rotate(0deg);
      }

      7% {
        opacity: 1;
      }

      88% {
        transform: translate(var(--x-end), var(--fall)) rotate(var(--spin));
      }

      94% {
        transform: translate(var(--x-end), calc(var(--fall) - 0.7svh)) rotate(var(--spin));
      }

      100% {
        opacity: 1;
        transform: translate(var(--x-end), var(--fall)) rotate(var(--spin));
      }
    }
  </style>
</head>
