<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LOARU – The Ritual v1.1</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 100vh;
      background: #000;
    }

    .title {
      position: absolute;
      top: max(5.5vh, 44px);
      left: 0;
      right: 0;
      z-index: 10;
      color: #d7b56d;
      text-align: center;
      font-size: clamp(24px, 7vw, 38px);
      font-weight: 300;
      letter-spacing: .28em;
      padding-left: .28em;
    }

    .vessel {
      position: absolute;
      left: 50%;
      top: 59%;
      width: min(102vw, 560px);
      height: auto;
      transform: translate(-50%, -50%);
      z-index: 2;
      user-select: none;
      -webkit-user-drag: none;
    }

    .disc {
      position: absolute;
      left: 50%;
      top: -22px;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      object-fit: contain;
      opacity: 0;
      z-index: 4;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.6));
      animation-name: dropDisc;
      animation-timing-function: cubic-bezier(.35,.03,.19,1);
      animation-fill-mode: forwards;
      user-select: none;
      -webkit-user-drag: none;
    }

    .footer {
      position: absolute;
      bottom: max(2.5vh, 18px);
      left: 0;
      right: 0;
      color: rgba(255,255,255,.28);
      text-align: center;
      font-size: 10px;
      letter-spacing: .34em;
      padding-left: .34em;
    }

    @keyframes dropDisc {
      0% {
        opacity: 0;
        transform: translate(var(--x-start), 0) scale(.94) rotate(0deg);
      }

      7% {
        opacity: 1;
      }

      88% {
        transform: translate(var(--x-end), var(--fall)) scale(1) rotate(var(--spin));
      }

      94% {
        transform: translate(var(--x-end), calc(var(--fall) - 0.8svh)) scale(1) rotate(var(--spin));
      }

      100% {
        opacity: 1;
        transform: translate(var(--x-end), var(--fall)) scale(1) rotate(var(--spin));
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <div class="title">THE RITUAL</div>

    <img class="vessel" src="assets/vessel.png" alt="LOARU Vessel">

    <!-- Drei einzelne Microdiscs -->
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-2px;--x-end:-5px;--fall:78.8svh;--spin:150deg;animation-duration:2.8s;animation-delay:1.0s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:2px;--x-end:4px;--fall:77.9svh;--spin:220deg;animation-duration:2.75s;animation-delay:3.2s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-3px;--x-end:8px;--fall:77.0svh;--spin:290deg;animation-duration:2.7s;animation-delay:5.25s;">

    <!-- Reduzierte Kaskade: ungefähr halb so viele Microdiscs -->
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-7px;--x-end:-18px;--fall:78.6svh;--spin:280deg;animation-duration:2.25s;animation-delay:7.10s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:7px;--x-end:17px;--fall:78.3svh;--spin:340deg;animation-duration:2.20s;animation-delay:7.20s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-2px;--x-end:-8px;--fall:77.6svh;--spin:210deg;animation-duration:2.22s;animation-delay:7.30s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:8px;--x-end:21px;--fall:77.4svh;--spin:300deg;animation-duration:2.28s;animation-delay:7.40s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-10px;--x-end:-23px;--fall:77.2svh;--spin:260deg;animation-duration:2.18s;animation-delay:7.50s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:2px;--x-end:6px;--fall:76.5svh;--spin:390deg;animation-duration:2.20s;animation-delay:7.60s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:10px;--x-end:24px;--fall:76.3svh;--spin:330deg;animation-duration:2.24s;animation-delay:7.70s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-6px;--x-end:-15px;--fall:76.1svh;--spin:250deg;animation-duration:2.16s;animation-delay:7.80s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:4px;--x-end:12px;--fall:75.4svh;--spin:420deg;animation-duration:2.18s;animation-delay:7.90s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-12px;--x-end:-26px;--fall:75.2svh;--spin:370deg;animation-duration:2.28s;animation-delay:8.00s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:7px;--x-end:18px;--fall:75.0svh;--spin:280deg;animation-duration:2.17s;animation-delay:8.10s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-1px;--x-end:-3px;--fall:74.3svh;--spin:360deg;animation-duration:2.20s;animation-delay:8.20s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:11px;--x-end:26px;--fall:74.1svh;--spin:410deg;animation-duration:2.24s;animation-delay:8.30s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-8px;--x-end:-20px;--fall:73.9svh;--spin:300deg;animation-duration:2.14s;animation-delay:8.40s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:2px;--x-end:7px;--fall:73.2svh;--spin:430deg;animation-duration:2.18s;animation-delay:8.50s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-13px;--x-end:-28px;--fall:73.0svh;--spin:380deg;animation-duration:2.30s;animation-delay:8.60s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:9px;--x-end:22px;--fall:72.8svh;--spin:320deg;animation-duration:2.12s;animation-delay:8.70s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-4px;--x-end:-11px;--fall:72.1svh;--spin:450deg;animation-duration:2.17s;animation-delay:8.80s;">

    <div class="footer">LOARU · VERSION 1.1</div>
  </main>
</body>
</html>
