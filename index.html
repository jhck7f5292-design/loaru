<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LOARU – The Ritual v1.6</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 100vh;
      background: #000;
    }

    .title {
      position: absolute;
      top: max(5.5vh, 44px);
      left: 0;
      right: 0;
      z-index: 10;
      color: #d7b56d;
      text-align: center;
      font-size: clamp(24px, 7vw, 38px);
      font-weight: 300;
      letter-spacing: .28em;
      padding-left: .28em;
    }

    .vessel {
      position: absolute;
      left: 50%;
      top: 59%;
      width: min(102vw, 560px);
      height: auto;
      transform: translate(-50%, -50%);
      z-index: 4;
      user-select: none;
      -webkit-user-drag: none;
    }

    .disc {
      position: absolute;
      left: 50%;
      top: -22px;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      object-fit: contain;
      opacity: 0;
      z-index: 3;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.6));
      animation-name: dropDisc;
      animation-timing-function: cubic-bezier(.35,.03,.19,1);
      animation-fill-mode: forwards;
      user-select: none;
      -webkit-user-drag: none;
    }

    .water-stream {
      position: absolute;
      left: 50%;
      top: -10vh;
      width: 3px;
      height: 0;
      margin-left: -1.5px;
      z-index: 6;
      opacity: 0;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,.08),
        rgba(220,242,255,.75),
        rgba(255,255,255,.16)
      );
      box-shadow: 0 0 5px rgba(185,225,255,.22);
      animation: waterStream 3.4s 11.2s ease-in-out forwards;
    }

    /* Wasser sitzt nur im schmalen Innenraum des Glases */
    .water-window {
      position: absolute;
      left: 50%;
      top: 63.1%;
      width: min(20.5vw, 86px);
      height: 16svh;
      transform: translate(-50%, -50%);
      z-index: 2;
      overflow: hidden;
      border-radius: 45% 45% 40% 40% / 8% 8% 12% 12%;
      pointer-events: none;
    }

    .water {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 0;
      opacity: 0;
      background: linear-gradient(
        to bottom,
        rgba(224,244,255,.08),
        rgba(176,219,243,.13) 45%,
        rgba(125,184,219,.16) 100%
      );
      border-radius: 47% 47% 40% 40% / 8% 8% 12% 12%;
      animation: waterRise 3.4s 11.2s ease-in-out forwards;
    }

    .water::before {
      content: "";
      position: absolute;
      top: -3px;
      left: 8%;
      width: 84%;
      height: 7px;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(230,247,255,.30) 0%,
        rgba(180,224,247,.15) 48%,
        transparent 78%
      );
      animation: ripple 1.1s 11.2s ease-in-out 3;
    }

    .footer {
      position: absolute;
      bottom: max(2.5vh, 18px);
      left: 0;
      right: 0;
      color: rgba(255,255,255,.28);
      text-align: center;
      font-size: 10px;
      letter-spacing: .34em;
      padding-left: .34em;
    }

    @keyframes dropDisc {
      0% {
        opacity: 0;
        transform: translate(var(--x-start), 0) scale(.94) rotate(0deg);
      }
      7% { opacity: 1; }
      88% {
        transform: translate(var(--x-end), var(--fall)) scale(1) rotate(var(--spin));
      }
      94% {
        transform: translate(var(--x-end), calc(var(--fall) - 0.55svh)) scale(1) rotate(var(--spin));
      }
      100% {
        opacity: 1;
        transform: translate(var(--x-end), var(--fall)) scale(1) rotate(var(--spin));
      }
    }

    @keyframes waterStream {
      0% { opacity: 0; height: 0; }
      8% { opacity: .85; height: 66svh; }
      88% { opacity: .85; height: 66svh; }
      100% { opacity: 0; height: 0; }
    }

    @keyframes waterRise {
      0% { opacity: 0; height: 0; }
      10% { opacity: 1; }
      100% { opacity: 1; height: 11.5svh; }
    }

    @keyframes ripple {
      0%, 100% {
        transform: scaleX(.88);
        opacity: .38;
      }
      50% {
        transform: scaleX(1);
        opacity: .65;
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <div class="title">THE RITUAL</div>

    <div class="water-window" aria-hidden="true">
      <div class="water"></div>
    </div>

    <img class="vessel" src="assets/vessel.png" alt="LOARU Vessel">

    <img class="disc" src="assets/core.png" alt="" style="--x-start:-2px;--x-end:-5px;--fall:78.8svh;--spin:150deg;animation-duration:2.8s;animation-delay:1.0s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:2px;--x-end:4px;--fall:78.5svh;--spin:220deg;animation-duration:2.75s;animation-delay:3.2s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-3px;--x-end:7px;--fall:78.2svh;--spin:290deg;animation-duration:2.7s;animation-delay:5.25s;">

    <img class="disc" src="assets/core.png" alt="" style="--x-start:-5px;--x-end:-15px;--fall:78.7svh;--spin:280deg;animation-duration:2.25s;animation-delay:7.10s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:5px;--x-end:15px;--fall:78.6svh;--spin:340deg;animation-duration:2.20s;animation-delay:7.20s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-2px;--x-end:-7px;--fall:78.3svh;--spin:210deg;animation-duration:2.22s;animation-delay:7.30s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:6px;--x-end:18px;--fall:78.2svh;--spin:300deg;animation-duration:2.28s;animation-delay:7.40s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-7px;--x-end:-20px;--fall:78.1svh;--spin:260deg;animation-duration:2.18s;animation-delay:7.50s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:2px;--x-end:5px;--fall:77.9svh;--spin:390deg;animation-duration:2.20s;animation-delay:7.60s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:7px;--x-end:20px;--fall:77.8svh;--spin:330deg;animation-duration:2.24s;animation-delay:7.70s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-4px;--x-end:-13px;--fall:77.7svh;--spin:250deg;animation-duration:2.16s;animation-delay:7.80s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:3px;--x-end:10px;--fall:77.5svh;--spin:420deg;animation-duration:2.18s;animation-delay:7.90s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-8px;--x-end:-22px;--fall:77.4svh;--spin:370deg;animation-duration:2.28s;animation-delay:8.00s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:5px;--x-end:15px;--fall:77.3svh;--spin:280deg;animation-duration:2.17s;animation-delay:8.10s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-1px;--x-end:-3px;--fall:77.1svh;--spin:360deg;animation-duration:2.20s;animation-delay:8.20s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:8px;--x-end:22px;--fall:77.0svh;--spin:410deg;animation-duration:2.24s;animation-delay:8.30s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-6px;--x-end:-17px;--fall:76.9svh;--spin:300deg;animation-duration:2.14s;animation-delay:8.40s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:2px;--x-end:6px;--fall:76.7svh;--spin:430deg;animation-duration:2.18s;animation-delay:8.50s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-9px;--x-end:-24px;--fall:76.6svh;--spin:380deg;animation-duration:2.30s;animation-delay:8.60s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:6px;--x-end:18px;--fall:76.5svh;--spin:320deg;animation-duration:2.12s;animation-delay:8.70s;">
    <img class="disc" src="assets/core.png" alt="" style="--x-start:-3px;--x-end:-9px;--fall:76.3svh;--spin:450deg;animation-duration:2.17s;animation-delay:8.80s;">

    <div class="water-stream" aria-hidden="true"></div>

    <div class="footer">LOARU · VERSION 1.6</div>
  </main>
</body>
</html>
