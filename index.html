<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LOARU – The Ritual v0.5</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 100vh;
      background: #000;
    }

    .title {
      position: absolute;
      top: max(5.5vh, 44px);
      left: 0;
      right: 0;
      z-index: 5;
      color: #d7b56d;
      text-align: center;
      font-size: clamp(24px, 7vw, 38px);
      font-weight: 300;
      letter-spacing: .28em;
      padding-left: .28em;
    }

    .vessel {
      position: absolute;
      left: 50%;
      top: 61%;
      width: min(96vw, 520px);
      height: auto;
      transform: translate(-50%, -50%);
      z-index: 2;
      user-select: none;
      -webkit-user-drag: none;
    }

    .core {
      position: absolute;
      left: 50%;
      top: -12px;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #8e5d3d 0 18%, #5a3321 45%, #2c170f 100%);
      box-shadow: 0 2px 5px rgba(0,0,0,.55);
      opacity: 0;
      z-index: 4;
      animation: dropDisc 2.8s 1.2s cubic-bezier(.35,.03,.19,1) forwards;
    }

    .footer {
      position: absolute;
      bottom: max(2.5vh, 18px);
      left: 0;
      right: 0;
      color: rgba(255,255,255,.28);
      text-align: center;
      font-size: 10px;
      letter-spacing: .34em;
      padding-left: .34em;
    }

    @keyframes dropDisc {
      0% {
        opacity: 0;
        transform: translateY(0);
      }
      8% {
        opacity: 1;
      }
      88% {
        transform: translateY(73.8svh);
      }
      94% {
        transform: translateY(72.9svh);
      }
      100% {
        opacity: 1;
        transform: translateY(73.4svh);
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="title">THE RITUAL</div>

    <img class="vessel" src="assets/vessel.png" alt="LOARU Vessel">

    <div class="core" aria-hidden="true"></div>

    <div class="footer">LOARU · VERSION 0.5</div>
  </main>
</body>
</html>
