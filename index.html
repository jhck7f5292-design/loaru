<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LOARU – The Ritual v0.4</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 100vh;
      background: #000;
    }

    .title {
      position: absolute;
      top: max(5.5vh, 44px);
      left: 0;
      right: 0;
      z-index: 5;
      color: #d7b56d;
      text-align: center;
      font-size: clamp(24px, 7vw, 38px);
      font-weight: 300;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      opacity: 0;
      animation: fadeIn 1.1s ease forwards;
    }

    .vessel {
      position: absolute;
      left: 50%;
      top: 61%;
      width: min(96vw, 520px);
      height: auto;
      transform: translate(-50%, -50%) scale(0.97);
      opacity: 0;
      z-index: 2;
      animation: vesselIn 1.2s 0.25s ease forwards;
      user-select: none;
      -webkit-user-drag: none;
    }

    .core {
      position: absolute;
      left: 50%;
      top: -18px;
      width: 11px;
      height: 11px;
      margin-left: -5.5px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #8e5d3d 0 18%, #5a3321 45%, #2c170f 100%);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.55);
      opacity: 0;
      z-index: 4;
      animation: dropDisc 2.7s 1.5s cubic-bezier(.35,.03,.19,1) forwards;
    }

    .footer {
      position: absolute;
      bottom: max(2.5vh, 18px);
      left: 0;
      right: 0;
      color: rgba(255, 255, 255, 0.28);
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.34em;
      padding-left: 0.34em;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes vesselIn {
      from {
        opacity: 0;
        transform: translate(-50%, -45%) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes dropDisc {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.9);
      }

      8% {
        opacity: 1;
      }

      82% {
        transform: translateY(67svh) scale(1);
      }

      91% {
        transform: translateY(65.7svh) scale(1);
      }

      100% {
        opacity: 1;
        transform: translateY(66.5svh) scale(1);
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <div class="title">THE RITUAL</div>

    <img
      class="vessel"
      src="assets/vessel.png"
      alt="LOARU Vessel"
    >

    <div class="core" aria-hidden="true"></div>

    <div class="footer">LOARU · VERSION 0.4</div>
  </main>
</body>
</html>
